name: Construir APK

# Arma el APK de Android de «Mercaboot 2» (versión 2) en los servidores de GitHub (no hace falta Android Studio).
# Se ejecuta solo al subir cambios que incluyan el archivo «disparador-apk.txt» (para volver a armarlo, edita ese archivo
# en GitHub y haz Commit). El botón «Run workflow» solo aparece si este archivo está en la rama principal.
# Resultado: Releases → «Mercaboot 2». También queda como «artifact» de la corrida.
# (Los Releases de las otras versiones —«voz-apk», «avance2-apk», etc.— no se tocan: cada versión tiene su propio nombre.)
#
# Antes de compilar se revisa src/config.ts (scripts/revisar-config.cjs):
#   · con los datos de ejemplo (REEMPLAZA-ESTO) el APK sale de PRUEBA, sin base de datos, y NO se publica en Releases;
#   · si ahí hay una llave secreta (service_role / secret) la corrida se detiene: esa llave jamás va dentro de la app.
#
# Avisos al teléfono (opcional): si en GitHub → Settings → Secrets and variables → Actions existe el secreto
# «GOOGLE_SERVICES_JSON» (el contenido del archivo google-services.json que baja Firebase), el APK sale con avisos al teléfono.
# Si no existe, el APK sale igual y todo lo demás funciona. Pasos completos en docs/GUIA-DE-ACTIVACION.md.
on:
  workflow_dispatch:
  push:
    paths: [disparador-apk.txt]

permissions:
  contents: write

concurrency:
  group: build-apk-v2
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Revisar la conexión con la base de datos (src/config.ts)
        id: nube
        run: node scripts/revisar-config.cjs 2>&1 | tee -a build.log

      # El servidor de GitHub ya trae el SDK de Android; solo hay que aceptar las licencias.
      - name: Aceptar las licencias de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Instalar dependencias
        id: instalar
        run: npm install --no-audit --no-fund 2>&1 | tee -a build.log

      - name: Crear los íconos (carpeta assets)
        id: iconos
        run: |
          mkdir -p "$RUNNER_TEMP/iconos"
          (cd "$RUNNER_TEMP/iconos" && npm init -y >/dev/null && npm i sharp --no-audit --no-fund 2>&1 | tail -3)
          NODE_PATH="$RUNNER_TEMP/iconos/node_modules" node scripts/hacer-iconos.cjs 2>&1 | tee -a build.log

      - name: Revisar tipos (TypeScript)
        id: tipos
        continue-on-error: true
        run: npx tsc --noEmit 2>&1 | tee -a build.log

      # Avisos al teléfono: el archivo google-services.json NO es secreto, pero se guarda como secreto para no subirlo al repositorio.
      - name: Avisos al teléfono (Firebase), si ya hay archivo
        id: firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
            node scripts/revisar-firebase.cjs google-services.json com.mercaboot.v2 2>&1 | tee -a build.log
            echo "con=true" >> "$GITHUB_OUTPUT"
          else
            echo "• Sin el secreto GOOGLE_SERVICES_JSON: el APK sale sin avisos al teléfono (todo lo demás funciona)." | tee -a build.log
            echo "con=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generar el proyecto Android
        id: prebuild
        run: npx expo prebuild --platform android --no-install 2>&1 | tee -a build.log

      - name: Dar más memoria a Gradle
        run: sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' android/gradle.properties

      - name: Compilar el APK
        id: gradle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=armeabi-v7a,arm64-v8a 2>&1 | tee -a ../build.log

      - name: Renombrar el APK
        id: apk
        run: cp android/app/build/outputs/apk/release/app-release.apk Mercaboot-v2.apk

      - name: Revisar el APK (firma, paquete y permisos)
        continue-on-error: true
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          {
            ls -l Mercaboot-v2.apk
            echo "== apksigner =="
            "$BT/apksigner" verify --verbose --print-certs Mercaboot-v2.apk | head -12
            echo "== aapt2 =="
            "$BT/aapt2" dump badging Mercaboot-v2.apk | grep -E "^package|sdkVersion|targetSdkVersion|uses-permission|application-label:|native-code" || true
          } 2>&1 | tee info-apk.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.nube.outputs.lista == 'true' && 'Mercaboot-v2-apk' || 'Mercaboot-v2-PRUEBA-sin-base-de-datos-apk' }}
          path: Mercaboot-v2.apk

      - name: Publicar el APK en Releases
        id: release
        if: steps.nube.outputs.lista == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v2-apk --cleanup-tag --yes || true
          gh release create v2-apk Mercaboot-v2.apk \
            --target "${{ github.sha }}" \
            --title "Mercaboot 2 · Versión 2 (Android)" \
            --notes "Mercaboot 2 (versión 2): se instala como otra app («Mercaboot 2») y NO reemplaza a la versión final registrada ni a «Mercaboot Voz»; usa la misma base de datos. Trae todo lo de la versión final y además: pagos con tarjeta por link del negocio y copiar CLABE y monto, importar productos desde Excel o Google Sheets (CSV), escáner de códigos de barras y de QR, compartir tu negocio con enlace y QR, reportar y bloquear, Boti con más funciones, avisos al teléfono (se activan al conectar Firebase), «Ideas para cocinar» con recetas por IA (se activan al poner la llave de la IA), pantalla «Acerca de». Descárgalo desde un celular Android y ábrelo para instalar; necesita internet. Si Android avisa que bloquea la instalación, permite instalar apps desde esta fuente (Configuración → Instalar apps desconocidas). Si aparece Play Protect, toca Instalar de todos modos. Avisos al teléfono en este APK: ${{ steps.firebase.outputs.con == 'true' && 'sí' || 'no (se activan al conectar Firebase)' }}. Corrida #${{ github.run_number }}, commit ${{ github.sha }}."

      - name: Guardar cómo terminó la corrida (rama «build-log»)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTADO: ${{ job.status }}
          P_NUBE: ${{ steps.nube.outcome }}
          CONFIG_LISTA: ${{ steps.nube.outputs.lista }}
          P_INSTALAR: ${{ steps.instalar.outcome }}
          P_ICONOS: ${{ steps.iconos.outcome }}
          P_TIPOS: ${{ steps.tipos.outcome }}
          P_PREBUILD: ${{ steps.prebuild.outcome }}
          P_GRADLE: ${{ steps.gradle.outcome }}
          P_APK: ${{ steps.apk.outcome }}
          P_RELEASE: ${{ steps.release.outcome }}
          CON_FIREBASE: ${{ steps.firebase.outputs.con }}
        run: |
          d="$(mktemp -d)"
          {
            echo "resultado: $RESULTADO"
            echo "avance: version-2"
            echo "avisos-al-telefono: ${CON_FIREBASE:-no}"
            echo "corrida: ${{ github.run_number }}"
            echo "commit: ${{ github.sha }}"
            echo "rama: ${{ github.ref_name }}"
            date -u +"fecha: %Y-%m-%dT%H:%M:%SZ"
            echo "config-lista: ${CONFIG_LISTA:-no}"
            echo "pasos: nube=$P_NUBE instalar=$P_INSTALAR iconos=$P_ICONOS tipos=$P_TIPOS prebuild=$P_PREBUILD gradle=$P_GRADLE apk=$P_APK release=$P_RELEASE"
          } > "$d/estado.txt"
          if [ -f info-apk.txt ]; then cp info-apk.txt "$d/info-apk.txt"; fi
          if [ -f build.log ]; then
            tail -n 300 build.log > "$d/build-cola.txt"
            grep -n -B2 -A14 -E "FAILURE: Build failed|What went wrong|^e: |error TS|npm error|ERR!|Error:" build.log | head -n 400 > "$d/errores.txt" || true
          fi
          cd "$d"
          git init -q -b build-log-v2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Corrida #${{ github.run_number }}: $RESULTADO"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:refs/heads/build-log-v2
