name: Construir APK

# Arma el APK de Android en los servidores de GitHub (no hace falta Android Studio).
# Se ejecuta solo al subir cambios que incluyan el archivo «disparador-apk.txt», o a mano:
# pestaña Actions → Construir APK → Run workflow.
# Resultado: Releases → «Mercaboot · Avance 2.1 (carrito y pedidos)». También queda como «artifact» de la corrida.
# (El Release del Avance 2.0, «avance2-apk», se deja intacto.)
#
# Antes de compilar se revisa src/config.ts (scripts/revisar-config.cjs):
#   · con los datos de ejemplo (REEMPLAZA-ESTO) el APK sale de PRUEBA, sin base de datos, y NO se publica en Releases;
#   · si ahí hay una llave secreta (service_role / secret) la corrida se detiene: esa llave jamás va dentro de la app.
on:
  workflow_dispatch:
  push:
    paths: [disparador-apk.txt]

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Revisar la conexión con la base de datos (src/config.ts)
        id: nube
        run: node scripts/revisar-config.cjs 2>&1 | tee -a build.log

      # El servidor de GitHub ya trae el SDK de Android; solo hay que aceptar las licencias.
      - name: Aceptar las licencias de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Instalar dependencias
        id: instalar
        run: npm install --no-audit --no-fund 2>&1 | tee -a build.log

      - name: Crear los íconos (carpeta assets)
        id: iconos
        run: |
          mkdir -p "$RUNNER_TEMP/iconos"
          (cd "$RUNNER_TEMP/iconos" && npm init -y >/dev/null && npm i sharp --no-audit --no-fund 2>&1 | tail -3)
          NODE_PATH="$RUNNER_TEMP/iconos/node_modules" node scripts/hacer-iconos.cjs 2>&1 | tee -a build.log

      - name: Revisar tipos (TypeScript)
        id: tipos
        continue-on-error: true
        run: npx tsc --noEmit 2>&1 | tee -a build.log

      - name: Generar el proyecto Android
        id: prebuild
        run: npx expo prebuild --platform android --no-install 2>&1 | tee -a build.log

      - name: Dar más memoria a Gradle
        run: sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' android/gradle.properties

      - name: Compilar el APK
        id: gradle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=armeabi-v7a,arm64-v8a 2>&1 | tee -a ../build.log

      - name: Renombrar el APK
        id: apk
        run: cp android/app/build/outputs/apk/release/app-release.apk Mercaboot-avance2-1.apk

      - name: Revisar el APK (firma, paquete y permisos)
        continue-on-error: true
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          {
            ls -l Mercaboot-avance2-1.apk
            echo "== apksigner =="
            "$BT/apksigner" verify --verbose --print-certs Mercaboot-avance2-1.apk | head -12
            echo "== aapt2 =="
            "$BT/aapt2" dump badging Mercaboot-avance2-1.apk | grep -E "^package|sdkVersion|targetSdkVersion|uses-permission|application-label:|native-code" || true
          } 2>&1 | tee info-apk.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.nube.outputs.lista == 'true' && 'Mercaboot-avance2-1-apk' || 'Mercaboot-avance2-1-PRUEBA-sin-base-de-datos-apk' }}
          path: Mercaboot-avance2-1.apk

      - name: Publicar el APK en Releases
        id: release
        if: steps.nube.outputs.lista == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete avance2-1-apk --cleanup-tag --yes || true
          gh release create avance2-1-apk Mercaboot-avance2-1.apk \
            --target "${{ github.sha }}" \
            --title "Mercaboot · Avance 2.1 (carrito y pedidos)" \
            --notes "APK de prueba del Avance 2.1: carrito de compras y pedidos apartados con tiempo límite (si el cliente no llega, el pedido se libera solo y el producto vuelve a estar a la venta), pago en persona o por transferencia, chat ligado a cada pedido y clientes frecuentes que elige el comerciante (descuento, regalo o cupón). Sigue con la base de datos en la nube en tiempo real, ubicación y chat. Descárgalo desde un celular Android y ábrelo para instalar; necesita internet. Si ya tenías el Avance 2, instálalo encima; si Android no lo permite, desinstala el anterior primero (tus datos están en la nube, no en el teléfono). Si Android avisa que bloquea la instalación, permite instalar apps desde esta fuente (Configuración → Instalar apps desconocidas). Si aparece Play Protect, toca Instalar de todos modos. Corrida #${{ github.run_number }}, commit ${{ github.sha }}."

      - name: Guardar cómo terminó la corrida (rama «build-log»)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTADO: ${{ job.status }}
          P_NUBE: ${{ steps.nube.outcome }}
          CONFIG_LISTA: ${{ steps.nube.outputs.lista }}
          P_INSTALAR: ${{ steps.instalar.outcome }}
          P_ICONOS: ${{ steps.iconos.outcome }}
          P_TIPOS: ${{ steps.tipos.outcome }}
          P_PREBUILD: ${{ steps.prebuild.outcome }}
          P_GRADLE: ${{ steps.gradle.outcome }}
          P_APK: ${{ steps.apk.outcome }}
          P_RELEASE: ${{ steps.release.outcome }}
        run: |
          d="$(mktemp -d)"
          {
            echo "resultado: $RESULTADO"
            echo "avance: 2.1"
            echo "corrida: ${{ github.run_number }}"
            echo "commit: ${{ github.sha }}"
            echo "rama: ${{ github.ref_name }}"
            date -u +"fecha: %Y-%m-%dT%H:%M:%SZ"
            echo "config-lista: ${CONFIG_LISTA:-no}"
            echo "pasos: nube=$P_NUBE instalar=$P_INSTALAR iconos=$P_ICONOS tipos=$P_TIPOS prebuild=$P_PREBUILD gradle=$P_GRADLE apk=$P_APK release=$P_RELEASE"
          } > "$d/estado.txt"
          if [ -f info-apk.txt ]; then cp info-apk.txt "$d/info-apk.txt"; fi
          if [ -f build.log ]; then
            tail -n 300 build.log > "$d/build-cola.txt"
            grep -n -B2 -A14 -E "FAILURE: Build failed|What went wrong|^e: |error TS|npm error|ERR!|Error:" build.log | head -n 400 > "$d/errores.txt" || true
          fi
          cd "$d"
          git init -q -b build-log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Corrida #${{ github.run_number }}: $RESULTADO"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:refs/heads/build-log
