name: Construir APK

# Arma el APK de Android en los servidores de GitHub (no hace falta Android Studio).
# Se ejecuta solo al subir cambios que incluyan el archivo «disparador-apk.txt» (para volver a armarlo, edita ese archivo
# en GitHub y haz Commit). El botón «Run workflow» solo aparece si este archivo está en la rama principal.
# Resultado: Releases → «Mercaboot · Versión final 4.0». También queda como «artifact» de la corrida.
# (Los Releases anteriores, «avance2-apk» y «avance2-1-apk», se dejan intactos.)
#
# Antes de compilar se revisa src/config.ts (scripts/revisar-config.cjs):
#   · con los datos de ejemplo (REEMPLAZA-ESTO) el APK sale de PRUEBA, sin base de datos, y NO se publica en Releases;
#   · si ahí hay una llave secreta (service_role / secret) la corrida se detiene: esa llave jamás va dentro de la app.
on:
  workflow_dispatch:
  push:
    paths: [disparador-apk.txt]

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Revisar la conexión con la base de datos (src/config.ts)
        id: nube
        run: node scripts/revisar-config.cjs 2>&1 | tee -a build.log

      # El servidor de GitHub ya trae el SDK de Android; solo hay que aceptar las licencias.
      - name: Aceptar las licencias de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Instalar dependencias
        id: instalar
        run: npm install --no-audit --no-fund 2>&1 | tee -a build.log

      - name: Crear los íconos (carpeta assets)
        id: iconos
        run: |
          mkdir -p "$RUNNER_TEMP/iconos"
          (cd "$RUNNER_TEMP/iconos" && npm init -y >/dev/null && npm i sharp --no-audit --no-fund 2>&1 | tail -3)
          NODE_PATH="$RUNNER_TEMP/iconos/node_modules" node scripts/hacer-iconos.cjs 2>&1 | tee -a build.log

      - name: Revisar tipos (TypeScript)
        id: tipos
        continue-on-error: true
        run: npx tsc --noEmit 2>&1 | tee -a build.log

      - name: Generar el proyecto Android
        id: prebuild
        run: npx expo prebuild --platform android --no-install 2>&1 | tee -a build.log

      - name: Dar más memoria a Gradle
        run: sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' android/gradle.properties

      - name: Compilar el APK
        id: gradle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=armeabi-v7a,arm64-v8a 2>&1 | tee -a ../build.log

      - name: Renombrar el APK
        id: apk
        run: cp android/app/build/outputs/apk/release/app-release.apk Mercaboot-final.apk

      - name: Revisar el APK (firma, paquete y permisos)
        continue-on-error: true
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          {
            ls -l Mercaboot-final.apk
            echo "== apksigner =="
            "$BT/apksigner" verify --verbose --print-certs Mercaboot-final.apk | head -12
            echo "== aapt2 =="
            "$BT/aapt2" dump badging Mercaboot-final.apk | grep -E "^package|sdkVersion|targetSdkVersion|uses-permission|application-label:|native-code" || true
          } 2>&1 | tee info-apk.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.nube.outputs.lista == 'true' && 'Mercaboot-final-apk' || 'Mercaboot-final-PRUEBA-sin-base-de-datos-apk' }}
          path: Mercaboot-final.apk

      - name: Publicar el APK en Releases
        id: release
        if: steps.nube.outputs.lista == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete final-apk --cleanup-tag --yes || true
          gh release create final-apk Mercaboot-final.apk \
            --target "${{ github.sha }}" \
            --title "Mercaboot · Versión final 4.0 (Android)" \
            --notes "APK de la VERSIÓN FINAL de Mercaboot (v4.0): todo lo de los avances en una sola app. Base de datos en la nube con tiempo real, ubicación, chat, carrito y pedidos apartados (paso a recogerlo o a domicilio, pago en persona o por transferencia), clientes frecuentes que elige el comerciante, reseñas con estrellas, avisos y promociones del comerciante, «lo más barato hoy», asistente «Ideas para cocinar» y fiestas. Descárgalo desde un celular Android y ábrelo para instalar; necesita internet. Si ya tenías un avance instalado, instálalo encima; si Android no lo permite, desinstala el anterior primero (tus datos están en la nube, no en el teléfono). Si Android avisa que bloquea la instalación, permite instalar apps desde esta fuente (Configuración → Instalar apps desconocidas). Si aparece Play Protect, toca Instalar de todos modos. Para iPhone usa la versión web instalable (ver LEEME). Corrida #${{ github.run_number }}, commit ${{ github.sha }}."

      - name: Guardar cómo terminó la corrida (rama «build-log»)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTADO: ${{ job.status }}
          P_NUBE: ${{ steps.nube.outcome }}
          CONFIG_LISTA: ${{ steps.nube.outputs.lista }}
          P_INSTALAR: ${{ steps.instalar.outcome }}
          P_ICONOS: ${{ steps.iconos.outcome }}
          P_TIPOS: ${{ steps.tipos.outcome }}
          P_PREBUILD: ${{ steps.prebuild.outcome }}
          P_GRADLE: ${{ steps.gradle.outcome }}
          P_APK: ${{ steps.apk.outcome }}
          P_RELEASE: ${{ steps.release.outcome }}
        run: |
          d="$(mktemp -d)"
          {
            echo "resultado: $RESULTADO"
            echo "avance: final-4.0"
            echo "corrida: ${{ github.run_number }}"
            echo "commit: ${{ github.sha }}"
            echo "rama: ${{ github.ref_name }}"
            date -u +"fecha: %Y-%m-%dT%H:%M:%SZ"
            echo "config-lista: ${CONFIG_LISTA:-no}"
            echo "pasos: nube=$P_NUBE instalar=$P_INSTALAR iconos=$P_ICONOS tipos=$P_TIPOS prebuild=$P_PREBUILD gradle=$P_GRADLE apk=$P_APK release=$P_RELEASE"
          } > "$d/estado.txt"
          if [ -f info-apk.txt ]; then cp info-apk.txt "$d/info-apk.txt"; fi
          if [ -f build.log ]; then
            tail -n 300 build.log > "$d/build-cola.txt"
            grep -n -B2 -A14 -E "FAILURE: Build failed|What went wrong|^e: |error TS|npm error|ERR!|Error:" build.log | head -n 400 > "$d/errores.txt" || true
          fi
          cd "$d"
          git init -q -b build-log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Corrida #${{ github.run_number }}: $RESULTADO"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:refs/heads/build-log
